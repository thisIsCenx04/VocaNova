name: vocanova_mobile
description: VocaNova vocabulary learning mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.7.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  fl_chart: ^1.2.0
  flutter_riverpod: 3.0.3
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  json_annotation: 4.9.0
  package_info_plus: ^10.1.0
  riverpod_annotation: 3.0.3
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  freezed: 3.2.3
  json_serializable: 6.11.2
  mocktail: ^1.0.5
  riverpod_generator: 3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
